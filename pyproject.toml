[project]
name = "rag-agent"
version = "0.1.0"
description = "Agentic RAG assistant demo on LangChain + LangGraph + LangSmith, with a Streamlit UI"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain>=1.3,<2",
    "langchain-core>=1.3,<2",
    "langgraph>=1.2,<2",
    "langchain-google-genai>=2.1,<3",
    "langchain-chroma>=1.1,<2",
    "langchain-community>=0.4,<0.5",
    "langchain-text-splitters>=1.1,<2",
    "langchain-tavily>=0.2,<0.3",
    "chromadb>=1.5,<2",
    "pypdf>=6,<7",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "langsmith>=0.8,<0.9",
    "openevals>=0.2,<0.3",
    "ddgs>=9.0",
    "streamlit>=1.38,<2",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
